<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06143D"/>
      <stop offset="1" stop-color="#102A70"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1EA7FF"/>
      <stop offset="1" stop-color="#1456D9"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43F39B"/>
      <stop offset="1" stop-color="#08A979"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42DDF5"/>
      <stop offset="1" stop-color="#1678FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Calendar -->
  <g filter="url(#shadow)">
    <rect x="82" y="96" width="348" height="320" rx="38" fill="#0B1F55"/>
    <path d="M82 134c0-21 17-38 38-38h272c21 0 38 17 38 38v70H82z" fill="url(#head)"/>
    <rect x="143" y="65" width="38" height="76" rx="19" fill="#25AFFF" stroke="#081A4C" stroke-width="12"/>
    <rect x="331" y="65" width="38" height="76" rx="19" fill="#25AFFF" stroke="#081A4C" stroke-width="12"/>

    <!-- Date tiles -->
    <g fill="#365A9E">
      <rect x="273" y="232" width="48" height="48" rx="11"/>
      <rect x="335" y="232" width="48" height="48" rx="11"/>
      <rect x="397" y="232" width="24" height="48" rx="11"/>
      <rect x="273" y="294" width="48" height="48" rx="11"/>
      <rect x="335" y="294" width="48" height="48" rx="11"/>
      <rect x="397" y="294" width="24" height="48" rx="11"/>
      <rect x="273" y="356" width="48" height="48" rx="11"/>
      <rect x="335" y="356" width="48" height="48" rx="11"/>
    </g>
    <rect x="335" y="294" width="48" height="48" rx="11" fill="#22D993"/>

    <!-- Leave / vacation motif -->
    <circle cx="178" cy="322" r="43" fill="#FFC32A"/>
    <path d="M176 354c-8-44-7-80 4-111 7-19 17-35 31-49-28 5-48 19-59 43-11-18-28-29-51-31 12 17 19 34 20 51-22-10-43-8-64 5 25 5 44 16 58 33-18 7-32 20-42 39 24-8 45-7 63 2-2 20 0 39 6 58z" fill="#F5FAFF"/>
    <path d="M85 401c43-37 95-48 153-33 37 9 70 26 101 50-62 7-116 1-162-18-35-14-66-13-92 1z" fill="url(#wave)"/>
    <path d="M82 418c48-22 91-19 130-2 40 18 83 22 128 12" fill="none" stroke="#69E7F7" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Approval badge -->
  <g filter="url(#shadow)">
    <circle cx="405" cy="388" r="65" fill="url(#check)" stroke="#07194A" stroke-width="8"/>
    <path d="M371 388l22 22 43-48" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>